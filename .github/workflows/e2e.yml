name: E2E (manual)

# Sengaja hanya bisa dijalankan manual dari tab Actions.
# Test ini menembak vocagame.com (produksi), jadi tidak boleh ikut
# berjalan otomatis di setiap push.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Filter test yang dijalankan"
        required: false
        default: "REG-003"
        type: string

jobs:
  e2e:
    name: Jalankan E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Jalankan test
        run: npx playwright test -c vocagame/playwright.config.ts -g "${{ inputs.grep }}"

      - name: Simpan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
